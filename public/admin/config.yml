backend:
  name: github
  repo: aadonisblanco/Griegos
  branch: main
  site_url: https://griegos.pages.dev
  github_client_id: Ov23liqbNEBd8EMtooXu

media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "config"
    label: "Configuración del sitio"
    files:
      - file: "public/data/config.json"
        label: "Configuración general"
        name: "config"
        fields:
          - {label: "Nombre del sitio", name: "siteName", widget: "string"}
          - {label: "Teléfono WhatsApp", name: "whatsappPhone", widget: "string"}
          - {label: "Mensaje de bienvenida", name: "welcomeMessage", widget: "text"}
